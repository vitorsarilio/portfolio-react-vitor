    <!-- Decide antes do primeiro desenho: escolha salva no botão do menu > preferência do sistema -->
    <script>
      (function () {
        var salvo = null;
        try { salvo = localStorage.getItem('animacoes'); } catch (e) {}
        var sistemaPedeMenos = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (salvo ? salvo === 'desligadas' : sistemaPedeMenos) document.documentElement.classList.add('sem-animacao');
      })();
    </script>
