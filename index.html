    <meta name="theme-color" content="#0A0B0B">
    <!-- Antes do primeiro desenho: tema (escolha salva ou o do sistema) e animações
         (sempre ligadas, a não ser que a pessoa desligue no botão do menu) -->
    <script>
      (function () {
        var tema = null, animacoes = null, idioma = null;
        try { tema = localStorage.getItem('tema'); animacoes = localStorage.getItem('animacoes'); idioma = localStorage.getItem('idioma'); } catch (e) {}
        if (idioma !== 'pt-BR' && idioma !== 'en-US') idioma = /^pt/i.test(navigator.language || '') ? 'pt-BR' : 'en-US';
        document.documentElement.setAttribute('lang', idioma);
        if (tema !== 'claro' && tema !== 'escuro') {
          tema = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
        }
        document.documentElement.setAttribute('data-tema', tema);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', tema === 'claro' ? '#F7F7F6' : '#0A0B0B');
        if (animacoes === 'desligadas') document.documentElement.classList.add('sem-animacao');
      })();
    </script>
